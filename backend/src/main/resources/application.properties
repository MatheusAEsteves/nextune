spring.application.name=nextune

# ==============================
# Banco de dados
# Valores padrao para desenvolvimento local; em outros ambientes use variaveis de ambiente
# (DB_URL, DB_USER, DB_PASSWORD) em vez de colocar senha neste arquivo.
# ==============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nextune}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Mostra as queries no console (desligue fora do desenvolvimento)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Flyway
# ==============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ==============================
# Upload de arquivos (audio ate 20 MB, imagens ate 5 MB - ver ArmazenamentoService)
# O padrao do Spring e 1 MB, pequeno demais para musica.
# ==============================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
nextune.storage.dir=${UPLOAD_DIR:./uploads}

# ==============================
# CORS: origens do front liberadas (separe por virgula)
# ==============================
nextune.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ==============================
# Mensagens de validacao sempre em portugues
# ==============================
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
